services:
  app:
    image: ghcr.io/thun-tigers/tt-agenda:latest
    ports:
      - "${AGENDA_PORT:-8080}:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY muss gesetzt sein}
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://tt_agenda:${POSTGRES_PASSWORD:-tt_agenda_dev}@db:5432/tt_agenda
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD muss gesetzt sein}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUSHOVER_URL: ${PUSHOVER_URL:-https://api.pushover.net/1/messages.json}
      AUTO_CREATE_DB: "true"
      TZ: Europe/Zurich
    volumes:
      - tt-agenda-instance:/app/instance
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloudflared-tt
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tt_agenda
      POSTGRES_USER: tt_agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tt_agenda_dev}
      # Alpine/musl kennt keine glibc-Locales; ICU-Provider ermöglicht Schweizer Sortierung (de-CH)
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=de-CH --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    volumes:
      - tt-agenda-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tt_agenda -d tt_agenda"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - cloudflared-tt

volumes:
  tt-agenda-instance:
  tt-agenda-db:
    

networks:
  cloudflared-tt:
    external: true