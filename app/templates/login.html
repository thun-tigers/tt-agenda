{% extends "base.html" %}
{% block title %}Anmelden · tt-planning{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-8 sm:py-12">
  <div class="mb-6 text-center"><div class="text-5xl text-indigo-600"><i class="bi bi-calendar2-heart"></i></div><h1 class="mt-3 text-2xl font-bold tracking-tight">Willkommen zurück</h1><p class="mt-2 text-sm text-slate-500">Melde dich an, um deine Trainings zu sehen.</p></div>
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <form method="post" class="space-y-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next_page }}">
      <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Benutzername</label><input class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" name="username" autocomplete="username" required autofocus></div>
      <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Passwort</label><input class="w-full rounded-xl border border-slate-300 px-4 py-3 text-base outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" type="password" name="password" autocomplete="current-password" required></div>
      <button class="w-full rounded-xl bg-indigo-600 px-4 py-3 font-semibold text-white shadow-sm transition hover:bg-indigo-700 hover:shadow-md">Anmelden</button>
    </form>
    <p class="mt-6 text-center text-sm text-slate-500">Noch kein Konto? <a class="font-medium text-indigo-600 hover:text-indigo-700" href="{{ url_for('auth.register') }}">Registrieren</a></p>
  </div>
</div>
{% endblock %}
