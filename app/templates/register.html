{% extends "base.html" %}
{% block title %}Registrieren · tt-planning{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl py-4 sm:py-8"><div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"><h1 class="text-2xl font-bold tracking-tight">Neues Konto</h1><p class="mt-1 text-sm text-slate-500">Registriere dich. Ein Coach oder Administrator prüft und aktiviert dein Konto anschließend.</p>
  <form method="post" class="mt-6 grid gap-5 sm:grid-cols-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Vorname</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" name="first_name" required></div>
    <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Nachname</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" name="last_name" required></div>
    <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Benutzername</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" name="username" autocomplete="username" required></div>
    <div><label class="mb-1.5 block text-sm font-medium text-slate-700">E-Mail</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" type="email" name="email"></div>
    <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Passwort</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" type="password" name="password" autocomplete="new-password" minlength="12" required></div>
    <div><label class="mb-1.5 block text-sm font-medium text-slate-700">Passwort wiederholen</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" type="password" name="password_confirmation" autocomplete="new-password" minlength="12" required></div>
    <div class="flex items-center justify-between gap-4 pt-2 sm:col-span-2"><a class="text-sm font-medium text-indigo-600 hover:text-indigo-700" href="{{ url_for('auth.login') }}">Schon registriert?</a><button class="rounded-xl bg-indigo-600 px-5 py-2.5 font-semibold text-white transition hover:bg-indigo-700">Konto erstellen</button></div>
  </form>
</div></div>
{% endblock %}
